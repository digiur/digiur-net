---
name: qdirstat
services:
  qdirstat:
    image: lscr.io/linuxserver/qdirstat:latest
    cpu_shares: 1024
    container_name: qdirstat

    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Denver
      CUSTOM_USER: admin
      PASSWORD: ${QDIRSTAT_PASSWORD}

    ports:
      - 3001:3001

    shm_size: "1gb"

    volumes:
      - /opt/digiur-net/qdirstat/config:/config
      - /:/data:ro

    restart: unless-stopped