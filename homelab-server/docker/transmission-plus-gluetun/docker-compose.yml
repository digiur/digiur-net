# Transmission Plus Gluetun stack
# Transmission shares Gluetun's network namespace, so it has no network path of
# its own: if Gluetun is stopped, Transmission has no internet access at all.
# Gluetun also runs a built-in kill-switch firewall that only allows traffic
# through the VPN tunnel, to the VPN server, and to allowed LAN devices, so even
# if the tunnel drops while Gluetun keeps running, traffic is blocked rather
# than falling back to the raw connection.
---
name: transmission-plus-gluetun
services:
  transmissionplus:
    image: lscr.io/linuxserver/transmission:latest
    cpu_shares: 2048
    container_name: transmissionplus

    # See header: shares Gluetun's network namespace, so this container has no network stack of its own.
    network_mode: "service:gluetun"

    volumes:
      - /opt/digiur-net/transmission-plus-gluetun/transmission-config:/config
      - /opt/digiur-net/transmission-plus-gluetun/watch:/watch
      - /storage/downloads/raw:/storage/downloads/raw

    environment:
      # USER/PASS come from ./.env (see .env.template); deploy.sh only
      # validates they're set, it won't fill them in for you.
      USER: ${DESIRED_TRANSMISSION_USER}
      PASS: ${DESIRED_TRANSMISSION_PASS}
      PGID: 1000
      PUID: 1000
      TZ: America/Denver

    restart: unless-stopped

  gluetun:
    # :latest tracks gluetun's unstable master branch; :v3 is the latest stable release line.
    image: qmcgaw/gluetun:v3
    cpu_shares: 2048
    container_name: gluetun

    # NET_ADMIN and /dev/net/tun are required for VPN operation
    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    # Only Gluetun exposes ports to the host - Transmission has none of its own.
    ports:
      - 9091:9091/tcp

    volumes:
      - /opt/digiur-net/transmission-plus-gluetun/gluetun:/gluetun

    environment:
      # OPENVPN_USER/OPENVPN_PASSWORD come from ./.env (see .env.template);
      # deploy.sh only validates they're set, it won't fill them in for you.
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PROTON_VPN_USER}
      - OPENVPN_PASSWORD=${PROTON_VPN_PASS}
      # Restricts server selection to port-forwarding-capable servers (separate from VPN_PORT_FORWARDING below)
      - PORT_FORWARD_ONLY=on
      # Requests the forwarded port; requires +pmp on OPENVPN_USER for ProtonVPN (see .env.template)
      - VPN_PORT_FORWARDING=on
      - SERVER_COUNTRIES=Switzerland
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
      - TZ=America/Denver

    restart: always
