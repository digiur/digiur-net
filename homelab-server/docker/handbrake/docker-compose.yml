---
name: handbrake
services:
  handbrake:
    container_name: handbrake
    image: jlesage/handbrake
    cpu_shares: 512
    environment:
      USER_ID: 1000
      GROUP_ID: 1000
      AUTOMATED_CONVERSION: 1
      AUTOMATED_CONVERSION_PRESET: 'Custom/H.265 QSV 1080p - 30'
      AUTOMATED_CONVERSION_OUTPUT_SUBDIR: SAME_AS_SRC
      AUTOMATED_CONVERSION_OVERWRITE_OUTPUT: 1

    devices:
      - /dev/dri:/dev/dri

    ports:
      - 5800:5800

    volumes:
      - /opt/digiur-net/handbrake/config:/config
      - /storage:/storage:ro
      - /storage/downloads/processing:/watch
      - /mnt/nas:/output

    restart: unless-stopped
