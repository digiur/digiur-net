---
name: dashy
services:
  dashy:
    image: lissy93/dashy
    cpu_shares: 1024
    container_name: dashy

    environment:
      UID: 1000
      GID: 1000
      NODE_ENV: production

    ports:
      - 80:8080

    volumes:
      - /opt/digiur-net/dashy/user-data:/app/user-data

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "node", "/app/services/healthcheck.js"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: always
