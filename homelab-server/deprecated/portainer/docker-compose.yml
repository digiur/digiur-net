---
name: portainer
services:
  portainer:
    image: portainer/portainer-ce:lts
    cpu_shares: 1024
    container_name: portainer

    ports:
      - 9443:9443

    volumes:
      - /opt/digiur-net/portainer/data:/data
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped
